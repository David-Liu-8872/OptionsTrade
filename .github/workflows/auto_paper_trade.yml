name: US Options 30-Day Auto Paper Trader

on:
  schedule:
    # 美股交易日 (周一至周五) 盘中自动巡检两次 (兼顾冬令时 EST 与夏令时 EDT，均处于美股期权实盘开盘时段):
    # 1) 15:30 UTC = 美东 10:30 EST / 11:30 EDT (早盘盘口稳定后巡检 & 自动建仓)
    - cron: '30 15 * * 1-5'
    # 2) 19:45 UTC = 美东 14:45 EST / 15:45 EDT (尾盘收盘前盯市 & 50%止盈/21DTE平仓结算)
    - cron: '45 19 * * 1-5'
  workflow_dispatch:
    inputs:
      mark_only:
        description: '仅盯市与平仓结算（不开新仓）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-paper-trader
  cancel-in-progress: false

jobs:
  simulate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend quantitative dependencies
        working-directory: backend
        run: uv sync --frozen || uv sync

      - name: Run Autonomous US Options Paper-Trading Cycle
        env:
          SIM_WEBHOOK_URL: ${{ secrets.SIM_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA_ARGS="--export-static"
          if [ "${{ github.event.inputs.mark_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --mark-only"
          fi
          uv run --directory backend python scripts/run_auto_sim.py $EXTRA_ARGS

      - name: Commit updated 30-day portfolio state back to repo
        run: |
          git config user.name "options-sim-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sim_portfolio.json
          if git diff --staged --quiet; then
            echo "No portfolio state changes to commit."
          else
            git commit -m "chore(sim): update 30-day options paper portfolio [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Node.js for Static Dashboard Build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Static Visual Dashboard (with latest sim & scan JSON)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # Default GitHub Pages entry view opens smoothly with relative assets

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages (if enabled in Repo Settings -> Pages)
        uses: actions/deploy-pages@v4
        continue-on-error: true
