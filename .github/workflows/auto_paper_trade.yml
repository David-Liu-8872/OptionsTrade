name: US Options 30-Day Auto Paper Trader

on:
  schedule:
    # 美股交易日 (周一至周五) 开盘时段每 30 分钟自动巡查一次 (覆盖冬令时 EST 与夏令时 EDT):
    # 代码内置 America/New_York 开盘时段门禁 (09:35-15:58 ET) 与节假日/盘口健康度校验，非开盘窗口秒级自动跳过
    - cron: '10,40 13-20 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/auto_paper_trade.yml'
  workflow_dispatch:
    inputs:
      mark_only:
        description: '仅盯市与平仓结算（不开新仓）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-paper-trader
  cancel-in-progress: false

jobs:
  simulate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.check_changes.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend quantitative dependencies
        working-directory: backend
        run: uv sync --frozen || uv sync

      - name: Run Autonomous US Options Paper-Trading Cycle (US Eastern Gate)
        env:
          SIM_WEBHOOK_URL: ${{ secrets.SIM_WEBHOOK_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_ONLY_TRADES: ${{ secrets.NOTIFY_ONLY_TRADES }}
        run: |
          EXTRA_ARGS="--export-static"
          if [ "${{ github.event_name }}" = "push" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --mark-only"
          elif [ "${{ github.event.inputs.mark_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --mark-only"
          fi
          uv run --directory backend python scripts/run_auto_sim.py $EXTRA_ARGS

      - name: Check if portfolio changed (skip Pages rebuild on closed-market cron ticks)
        id: check_changes
        run: |
          if git diff --quiet data/sim_portfolio.json && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Market closed / no portfolio changes on scheduled tick; skipping commit & Pages rebuild."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated 30-day portfolio state back to repo
        if: steps.check_changes.outputs.should_publish == 'true'
        run: |
          git config user.name "options-sim-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sim_portfolio.json
          if git diff --staged --quiet; then
            echo "No portfolio state changes to commit."
          else
            git commit -m "chore(sim): update 30-day options paper portfolio [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Node.js for Static Dashboard Build
        if: steps.check_changes.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Static Visual Dashboard (with latest sim & scan JSON)
        if: steps.check_changes.outputs.should_publish == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload GitHub Pages artifact
        if: steps.check_changes.outputs.should_publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    needs: simulate-and-build
    if: needs.simulate-and-build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry Deploy to GitHub Pages if artifact index lagged
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
